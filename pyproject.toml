[project]
name = "videotool"
version = "0.1.0"
description = "视频格式转换器（ffmpeg 命令行驱动）"
requires-python = ">=3.10"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videotool"]
